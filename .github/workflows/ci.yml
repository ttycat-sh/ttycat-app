name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Sparkle comes from GitHub's release downloads, which can be down for a while: it's kept between
      # runs, and fetched again a few times before giving up.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Packages, with retries
        run: |
          for wait in 15 30 60 120 0; do
            swift package resolve && exit 0
            [ "$wait" = 0 ] || { echo "retrying in ${wait}s"; sleep "$wait"; }
          done
          exit 1
      - name: The app
        run: swift test
      - name: What a release is told, and the colours
        run: python3 -m unittest discover -s tools/tests
      - name: It builds, with no firmware beside it
        run: ./build.sh
      - name: It stands on its own
        run: |
          test ! -e Sources/TTYCat/_extra
          ! git grep -n -E 'ProFeatures\.' -- ':!Sources/TTYCat/Extensions.swift'
